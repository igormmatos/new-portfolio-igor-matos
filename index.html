<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      ⚡ IMPORT MAP CRÍTICO (SÍNCRONO)
      Define as versões exatas do React 18 e dependências antes que qualquer módulo carregue.
      Isso previne conflitos com o React 19 do ambiente e corrige erros de resolução no Vercel.
    -->
    <script>
      (function() {
        // Definição do Import Map alinhada com package.json
        const importMap = {
          "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
            "@hello-pangea/dnd": "https://esm.sh/@hello-pangea/dnd@16.6.0?external=react,react-dom"
          }
        };

        // Injeção Síncrona
        const imScript = document.createElement('script');
        imScript.type = 'importmap';
        imScript.textContent = JSON.stringify(importMap, null, 2);
        imScript.setAttribute('data-injected', 'true');
        document.head.appendChild(imScript);

        // Proteção contra injeção de React 19 pelo ambiente (Google AI Studio/Outros)
        // Remove qualquer outro importmap que tente ser inserido depois
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.tagName === 'SCRIPT' && node.type === 'importmap' && !node.hasAttribute('data-injected')) {
                // Log movido para debug para limpar o console em produção
                // console.debug('🛑 Bloqueando importmap conflitante do ambiente:', node);
                node.remove();
              }
            });
          });
        });
        observer.observe(document.head, { childList: true });
      })();
    </script>

    <title>Igor Matos | Portfólio de Arquiteto Sênior</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://iquantqgsrgwbqfwbhfq.supabase.co/storage/v1/object/public/media/image/favicon.ico" />
